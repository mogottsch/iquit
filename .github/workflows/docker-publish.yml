name: Build and Publish Docker Image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide publication eligibility
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)
          event, ref = os.environ['EVENT_NAME'], os.environ['REF']
          before, head = os.environ['BEFORE'], os.environ['HEAD_SHA']
          allowed = False
          try:
              # Unknown history fails closed; explicit release tags retain authority.
              known_head = bool(re.fullmatch(r'[0-9a-f]{40}', head)) and git('rev-parse', 'HEAD').decode().strip() == head
              trusted = os.environ['REPOSITORY'] == 'mogottsch/iquit' and known_head
              if trusted and event == 'push' and ref.startswith('refs/tags/v'):
                  allowed = True
              elif trusted and event == 'push' and ref == 'refs/heads/main' and re.fullmatch(r'[0-9a-f]{40}', before) and before != '0' * 40:
                  git('merge-base', '--is-ancestor', before, head)
                  changed = git('diff', '--name-only', '-z', '--no-renames', before, head, '--').split(b'\0')
                  ignored = {b'renovate.json', b'.github/workflows/docker-publish.yml', b''}
                  allowed = any(name not in ignored for name in changed)
          except subprocess.CalledProcessError:
              allowed = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'allowed={str(allowed).lower()}\n')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.publication.outputs.allowed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.publication.outputs.allowed == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TMDB_API_KEY=${{ secrets.VITE_TMDB_API_KEY }}
